name: UniRoom - 4 Stage CI/CD
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 1 - Test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_uniroom_test_only
          MYSQL_DATABASE: uniroom_db
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci_uniroom_test_only"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      UNIROOM_DB_PASSWORD: ci_uniroom_test_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp -Dtest=MySqlMigrationIntegrationTest test
      - run: mvn -B -ntp clean test

  build:
    name: 2 - Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp -DskipTests clean package

  push:
    name: 3 - Push to Docker Hub
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/uniroom:latest

  deploy:
    name: 4 - Deploy to Railway
    needs: push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
    steps:
      - uses: actions/checkout@v4
      # Railway builds the current Dockerfile from this commit, then deploys it.
     - run: railway up --project ee97a75c-1831-45de-b96c-a122c292e56d --environment production --service "$RAILWAY_SERVICE_ID" --ci
