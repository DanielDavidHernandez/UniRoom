
name: UniRoom CI - Automated Tests

on:
  push:
    branches:
      - main
      - develop
      - feature/api-rest

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test UniRoom

    runs-on: ubuntu-latest

    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0

        env:
          MYSQL_ROOT_PASSWORD: ci_uniroom_test_only
          MYSQL_DATABASE: uniroom_db

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci_uniroom_test_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    env:
      UNIROOM_DB_PASSWORD: ci_uniroom_test_only
      TZ: America/Bogota

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Display Java and Maven versions
        run: |
          java -version
          mvn -version

      - name: Verify MySQL connection
        run: |
          mysql --host=127.0.0.1 \
                --port=3306 \
                --user=root \
                --password="$UNIROOM_DB_PASSWORD" \
                --database=uniroom_db \
                --execute="SELECT VERSION();"

      - name: Run Maven tests
        run: mvn --batch-mode --no-transfer-progress clean test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uniroom-test-results
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7
