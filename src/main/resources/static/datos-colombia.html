<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>UniRoom | Datos abiertos</title><style>body{font-family:system-ui;background:#faf8f3;color:#2c352d;margin:0}header{background:#355b42;color:white;padding:24px}main{max-width:970px;margin:32px auto;padding:0 16px}section{background:white;border:1px solid #deded4;padding:22px;border-radius:12px}button{background:#355b42;color:white;padding:10px 18px;border:0;border-radius:8px;cursor:pointer}select{padding:10px}table{border-collapse:collapse;width:100%;margin-top:18px}td,th{border-bottom:1px solid #ddd;padding:9px;text-align:left}#message{margin:16px 0}</style></head><body><header><h1>UniRoom · Observatorio educativo colombiano</h1><p>Datos abiertos oficiales del Ministerio de Educación Nacional</p></header><main><section><label for="source">Fuente: </label><select id="source"><option value="n5yy-8nav">Instituciones de educación superior</option><option value="y9ga-zwzy">Matrícula por municipios</option></select> <button onclick="load()">Consultar estadísticas</button><p id="message" role="status">Seleccione una fuente para consultar.</p><table><thead><tr><th>Indicador / categoría</th><th>Resultado</th></tr></thead><tbody id="results"></tbody></table></section></main><script>async function load(){const id=document.getElementById('source').value;const msg=document.getElementById('message');const tbody=document.getElementById('results');msg.textContent='Consultando fuente oficial…';tbody.replaceChildren();try{const response=await fetch('/api/v1/datos-colombia/'+id+'/estadisticas?limit=100');const data=await response.json();if(!response.ok)throw new Error(data.error||'Error HTTP '+response.status);msg.textContent='Registros analizados: '+data.registros+' · Circuit breaker: '+data.circuitBreaker;for(const item of data.estadisticas){const tr=document.createElement('tr');const td1=document.createElement('td');const td2=document.createElement('td');td1.textContent=item.consulta==='estadisticas'?'Resumen de registros':item.categoria;td2.textContent=item.consulta==='estadisticas'?`${item.cantidad} filas · ${item.promedioCampos} campos promedio`:item.cantidad;tr.append(td1,td2);tbody.appendChild(tr)}}catch(err){msg.textContent='No fue posible consultar los datos: '+err.message}}</script></body></html>
